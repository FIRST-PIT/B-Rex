rootProject.name = 'brex'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

// Robot-side modules: compiled for Java 8 / Android API 25 (REV Control Hub).
include 'brex-core'
include 'brex-recording'
include 'brex-hardware'

// Desktop modules: Java 17.
include 'brex-analysis'
include 'brex-replay'
include 'brex-sim'
include 'brex-testing'
include 'brex-cli'
